# 迁移自 mytool/tmux/wsw.tmux.conf
# 状态脚本路径走稳定中转链接（$HOME 由 tmux 的 #() 交给 sh 展开），
# 这样仓库搬到哪儿都不用改这里。

# 状态栏设置
# 设置tmux窗口列表，显示到状态栏中间
set-option -g status-justify centre

# 设置状态栏中当前活动窗口的对应的标签为蓝色
setw -g window-status-current-style "bg=blue, fg=white"
setw -g window-status-style "fg=black"

# 设置窗口列表的分隔符为“|”
setw -g window-status-separator  '|'

# 设置状态栏显示的窗口编号起始号码为1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on


# 状态栏整体刷新时间
set-option -g status-interval 1
# 状态栏左侧内容颜色及最大长度
# C: CPU占用率  M: 内存占用率  S: swap占用率
set-option -g status-left "#($HOME/.wtool/links/terminal/tmux/bin/mem.sh)#($HOME/.wtool/links/terminal/tmux/bin/cpu.sh)#($HOME/.wtool/links/terminal/tmux/bin/disk.sh)"
set-option -g status-left-style "bg=magenta fg=black"
set-option -g status-left-length 90
# 状态栏右内容颜色及最大长度
set-option -g status-right-style "bg=yellow"

# 设定tmux窗格的缓冲区最多缓冲的行数
set-option -g history-limit 5000

# 使能鼠标，鼠标启动后，可以按下shift来恢复原本的操作
set-option -g mouse on

# tmux取消Leader+Space切换pane布局
unbind Space

# 设置终端支持256color
set -g default-terminal "screen-256color"

# 设置alt+hjkl四个按键为切换当前焦点pane为左下上右四个方向的pane
# Alt + h：向左切换，仅当不是最左边时
bind-key -n M-h if-shell "[ $(tmux display -p '#{pane_at_left}')   -eq 0 ]" "select-pane -L" ""
# Alt + j：向下切换，仅当不是最下边时
bind-key -n M-j if-shell "[ $(tmux display -p '#{pane_at_bottom}') -eq 0 ]" "select-pane -D" ""
# Alt + k：向上切换，仅当不是最上边时
bind-key -n M-k if-shell "[ $(tmux display -p '#{pane_at_top}')    -eq 0 ]" "select-pane -U" ""
# Alt + l：向右切换，仅当不是最右边时
bind-key -n M-l if-shell "[ $(tmux display -p '#{pane_at_right}')  -eq 0 ]" "select-pane -R" ""


# 使用 Alt + H/J/K/L 交换当前 pane 与左、下、上、右 pane 的位置
bind-key -n M-H swap-pane -s '{left-of}'
bind-key -n M-J swap-pane -s '{down-of}'
bind-key -n M-K swap-pane -s '{up-of}'
bind-key -n M-L swap-pane -s '{right-of}'
# 使用 Alt + Ctrl + h/j/k/l 调整 pane 大小
bind-key -n C-M-h resize-pane -L 5
bind-key -n C-M-j resize-pane -D 5
bind-key -n C-M-k resize-pane -U 5
bind-key -n C-M-l resize-pane -R 5

# Esc+hjkl也会切换panel，这在使用vim时会导致问题
unbind-key Escape
# 设置excape的相应时间为50ms，默认是500ms
set-option -g escape-time 50
